[general]
log_dir = "logs"
state_file = "data/state.json"
max_pages = 3
http_timeout_seconds = 15
http_retries = 3

[notification]
format = "medium"
self_alert_webhook_env = "DISCORD_WEBHOOK_ALERT"

[gemini]
api_key_env = "GEMINI_API_KEY"
model = "gemini-2.5-flash"
timeout_seconds = 25

[calendar]
enabled = true
output_dir = "docs/calendar"
site_url = "https://7bellaa.github.io/cse-notice-bot/calendar"
months_in_png = 2
font_path = "assets/fonts/Pretendard-Medium.ttf"
cache_path = "data/post_cache.json"
manual_overrides_path = "data/manual_deadlines.json"
cache_ttl_days = 30

[[boards]]
id = "14221"
name = "정컴 일반공지"
url = "https://cse.pusan.ac.kr/cse/14221/subview.do"
webhook_envs = ["DISCORD_WEBHOOK_GENERAL", "DISCORD_WEBHOOK_JOBLESS"]
enabled = true
