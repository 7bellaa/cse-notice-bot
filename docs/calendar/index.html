<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PNU CSE 마감 캘린더</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/ko.global.min.js"></script>
</head>
<body>
  <header class="site-head">
    <div class="brand">
      📅 PNU CSE 마감 캘린더
      <div class="brand-subtitle brand-subtitle--full">각 일정은 해당 날짜에 마감되는 공지입니다 (공지 게시일 아님)</div>
      <div class="brand-subtitle brand-subtitle--short">마감일 기준 캘린더입니다.<button class="info-pop" type="button" aria-label="자세히 보기" data-info-toggle>ⓘ</button></div>
    </div>
    <div class="meta">
      <span id="event-count" class="badge">…건 마감 예정</span>
      <a class="github-link" href="https://github.com/7bellaa/cse-notice-bot" target="_blank" rel="noopener">
        ↗ GitHub
      </a>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="마감일 캘린더">
      <h1 class="hero-word">마감일</h1>
      <span class="hero-tag">DEADLINE · 해당 날짜에 마감되는 공지</span>
    </section>

    <div class="legend-bar" id="legend-bar" aria-label="카테고리 색상 범례">
      <div class="legend-bar__items" id="legend-bar-items">
        <span class="legend-chip" data-category="scholarship">
          <span class="legend-chip__dot" style="background:#8b5cf6"></span>
          <span class="legend-chip__label">장학/등록</span>
        </span>
        <span class="legend-chip" data-category="academic">
          <span class="legend-chip__dot" style="background:#14b8a6"></span>
          <span class="legend-chip__label">학업/수강</span>
        </span>
        <span class="legend-chip" data-category="career">
          <span class="legend-chip__dot" style="background:#ec4899"></span>
          <span class="legend-chip__label">졸업/진로</span>
        </span>
        <span class="legend-chip" data-category="extracurricular">
          <span class="legend-chip__dot" style="background:#f59e0b"></span>
          <span class="legend-chip__label">비교과/활동</span>
        </span>
        <span class="legend-chip" data-category="notice">
          <span class="legend-chip__dot" style="background:#6b7280"></span>
          <span class="legend-chip__label">일반공지</span>
        </span>
        <span class="legend-bar__divider" aria-hidden="true"></span>
        <span class="legend-chip">
          <span class="legend-chip__label">★ 중요 일정</span>
        </span>
      </div>
    </div>

    <div id="calendar"></div>
  </main>

  <!-- Mobile Bottom Sheet (MOB-2) -->
  <div id="day-sheet-backdrop" class="day-sheet__backdrop" data-close-sheet></div>
  <aside id="day-sheet" class="day-sheet" role="dialog" aria-modal="true" aria-labelledby="day-sheet-title" hidden>
    <div class="day-sheet__handle" aria-hidden="true"></div>
    <header class="day-sheet__header">
      <span id="day-sheet-title">날짜</span>
      <button class="modal-close" type="button" data-close-sheet aria-label="닫기">×</button>
    </header>
    <div id="day-sheet-list" class="day-sheet__list"></div>
  </aside>

  <!-- Mobile hint toast (MOB-2) -->
  <div id="mobile-toast" class="mobile-toast" role="status" aria-live="polite" hidden></div>

  <!-- Event detail modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-tags">
          <span id="modal-category" class="cat-badge">카테고리</span>
          <span id="modal-important" class="important-badge" hidden>★ 중요</span>
        </div>
        <button class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <h2 id="modal-title">제목</h2>
      <p id="modal-summary" class="modal-summary" hidden></p>
      <div class="modal-row">
        <span class="modal-label">마감</span>
        <span id="modal-date">YYYY-MM-DD</span>
        <span id="modal-dn" class="d-tag">D-?</span>
      </div>
      <div class="modal-actions">
        <a id="modal-link" href="#" target="_blank" rel="noopener" class="btn-primary">원문 보기</a>
      </div>
    </div>
  </div>

  <div
    id="event-tooltip"
    class="event-tooltip"
    role="tooltip"
    hidden
    aria-hidden="true"
  ></div>

  <script>
    (function () {
      // Canonical category → (short chip text, machine-readable token)
      // Keep keys in sync with src/cse_bot/category.py CLASSIFICATION_PALETTE.
      const categoryMeta = {
        "장학/등록":  { short: "장학",   key: "scholarship" },
        "학업/수강":  { short: "학업",   key: "academic" },
        "졸업/진로":  { short: "졸업",   key: "career" },
        "비교과/활동": { short: "비교과", key: "extracurricular" },
        "일반공지":   { short: "공지",   key: "notice" },
      };
      const defaultCategoryMeta = { short: "공지", key: "notice" };

      function metaFor(cat) {
        return categoryMeta[cat] || defaultCategoryMeta;
      }

      // ─── View preference + auto list-view on mobile (P0-3) ──────
      const VIEW_PREF_KEY = "view.preference";
      const MOBILE_MAX_PX = 768;

      function preferredInitialView() {
        const explicit = sessionStorage.getItem(VIEW_PREF_KEY);
        if (explicit === "dayGridMonth" || explicit === "listMonth") return explicit;
        return window.innerWidth <= MOBILE_MAX_PX ? "listMonth" : "dayGridMonth";
      }

      function rememberView(viewName) {
        try { sessionStorage.setItem(VIEW_PREF_KEY, viewName); } catch (e) {}
      }

      // 5-category canonical palette — keep in sync with src/cse_bot/category.py
      const palette = {
        "장학/등록": "#8b5cf6",
        "학업/수강": "#14b8a6",
        "졸업/진로": "#ec4899",
        "비교과/활동": "#f59e0b",
        "일반공지": "#6b7280",
      };
      const defaultColor = "#6b7280";

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      function daysUntil(iso) {
        const d = new Date(iso);
        d.setHours(0, 0, 0, 0);
        return Math.round((d - today) / 86400000);
      }

      function dTag(iso) {
        const delta = daysUntil(iso);
        if (delta < 0) return { text: "지남", className: "d-past" };
        if (delta === 0) return { text: "오늘", className: "d-today" };
        if (delta === 1) return { text: "D-1", className: "d-urgent" };
        if (delta <= 3) return { text: `D-${delta}`, className: "d-urgent" };
        if (delta <= 7) return { text: `D-${delta}`, className: "d-near" };
        return { text: `D-${delta}`, className: "d-soft" };
      }

      function stripPrefix(title) {
        const m = title.match(/^\s*\[[^\]]+\]\s*/);
        return m ? title.slice(m[0].length) : title;
      }

      const modal = document.getElementById("modal");
      const modalTitle = document.getElementById("modal-title");
      const modalSummary = document.getElementById("modal-summary");
      const modalDate = document.getElementById("modal-date");
      const modalCategory = document.getElementById("modal-category");
      const modalImportant = document.getElementById("modal-important");
      const modalDn = document.getElementById("modal-dn");
      const modalLink = document.getElementById("modal-link");

      function showModal(event) {
        const cat = event.extendedProps.category || "일반공지";
        const summary = (event.extendedProps.summary || "").trim();
        const important = !!event.extendedProps.important;
        modalTitle.textContent = stripPrefix(event.title);
        if (summary) {
          modalSummary.textContent = summary;
          modalSummary.hidden = false;
        } else {
          modalSummary.hidden = true;
        }
        modalDate.textContent = event.startStr;
        modalCategory.textContent = cat;
        modalCategory.style.backgroundColor = palette[cat] || defaultColor;
        modalImportant.hidden = !important;
        const tag = dTag(event.startStr);
        modalDn.textContent = tag.text;
        modalDn.className = `d-tag ${tag.className}`;
        modalLink.href = event.url || "#";
        modal.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function hideModal() {
        modal.hidden = true;
        document.body.style.overflow = "";
      }
      modal.addEventListener("click", (e) => {
        if (e.target.matches("[data-close]")) hideModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.hidden) hideModal();
      });

      // ─── Shared event tooltip (P0-1c) ────────────────────────────
      const tooltipEl = document.getElementById("event-tooltip");
      let tooltipTimer = null;

      function positionTooltip(anchor) {
        const rect = anchor.getBoundingClientRect();
        const tipRect = tooltipEl.getBoundingClientRect();
        const top = window.scrollY + rect.bottom + 6;
        let left = window.scrollX + rect.left;
        const maxLeft = window.scrollX + document.documentElement.clientWidth - tipRect.width - 8;
        if (left > maxLeft) left = Math.max(8, maxLeft);
        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
      }

      function showTooltip(anchor, text) {
        if (!tooltipEl || !text) return;
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(() => {
          tooltipEl.textContent = text;
          tooltipEl.hidden = false;
          tooltipEl.setAttribute("aria-hidden", "false");
          positionTooltip(anchor);
          tooltipEl.setAttribute("data-visible", "true");
        }, 250);
      }

      function hideTooltip() {
        clearTimeout(tooltipTimer);
        if (!tooltipEl) return;
        tooltipEl.removeAttribute("data-visible");
        tooltipEl.hidden = true;
        tooltipEl.setAttribute("aria-hidden", "true");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideTooltip();
      });

      // ─── Mobile Bottom Sheet (MOB-2) ────────────────────────────
      const daySheet = document.getElementById("day-sheet");
      const daySheetBackdrop = document.getElementById("day-sheet-backdrop");
      const daySheetTitle = document.getElementById("day-sheet-title");
      const daySheetList = document.getElementById("day-sheet-list");

      function formatKoreanDate(iso) {
        const d = new Date(iso);
        return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
      }

      function openDaySheet(dateStr, events) {
        daySheetTitle.textContent = formatKoreanDate(dateStr);
        daySheetList.innerHTML = "";
        if (events.length === 0) {
          const empty = document.createElement("div");
          empty.className = "day-sheet__empty";
          empty.textContent = "이 날짜에 마감 일정이 없습니다.";
          daySheetList.appendChild(empty);
        } else {
          events.forEach((ev) => {
            const cat = ev.extendedProps.category || "일반공지";
            const meta = metaFor(cat);
            const important = !!ev.extendedProps.important;
            const stripped = stripPrefix(ev.title);
            const item = document.createElement("a");
            item.className = "day-sheet__item";
            item.href = ev.url || "#";
            item.target = "_blank";
            item.rel = "noopener";
            item.setAttribute("data-category", meta.key);
            const head = document.createElement("div");
            head.className = "day-sheet__item-head";
            const tag = document.createElement("span");
            tag.className = "chip-tag";
            tag.textContent = meta.short;
            head.appendChild(tag);
            const tagInfo = dTag(ev.startStr);
            const dn = document.createElement("span");
            dn.className = `d-tag ${tagInfo.className}`;
            dn.textContent = tagInfo.text;
            head.appendChild(dn);
            item.appendChild(head);
            const title = document.createElement("span");
            title.className = "day-sheet__item-title";
            title.textContent = (important ? "★ " : "") + stripped;
            item.appendChild(title);
            daySheetList.appendChild(item);
          });
        }
        daySheet.hidden = false;
        daySheetBackdrop.dataset.open = "true";
        requestAnimationFrame(() => { daySheet.dataset.open = "true"; });
        document.body.style.overflow = "hidden";
      }

      function closeDaySheet() {
        daySheet.dataset.open = "false";
        daySheetBackdrop.dataset.open = "false";
        setTimeout(() => { daySheet.hidden = true; }, 240);
        document.body.style.overflow = "";
      }

      document.addEventListener("click", (e) => {
        if (e.target.matches("[data-close-sheet]")) closeDaySheet();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && daySheet.dataset.open === "true") closeDaySheet();
      });

      // Swipe-down to close
      let touchStartY = null;
      daySheet.addEventListener("touchstart", (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      daySheet.addEventListener("touchmove", (e) => {
        if (touchStartY === null) return;
        const dy = e.touches[0].clientY - touchStartY;
        if (dy > 0) daySheet.style.transform = `translateY(${dy}px)`;
      }, { passive: true });
      daySheet.addEventListener("touchend", (e) => {
        if (touchStartY === null) return;
        const dy = e.changedTouches[0].clientY - touchStartY;
        daySheet.style.transform = "";
        if (dy > 80) closeDaySheet();
        touchStartY = null;
      });

      // ─── Mobile hint toast (MOB-2 risk mitigation) ──────────────
      const HINT_KEY = "mobile.hint.seen";
      const mobileToast = document.getElementById("mobile-toast");
      function maybeShowMobileHint() {
        if (window.innerWidth > MOBILE_MAX_PX) return;
        if (sessionStorage.getItem(HINT_KEY)) return;
        mobileToast.textContent = "📅 모바일에서는 목록 뷰가 기본입니다 (월 ↻ 가능)";
        mobileToast.hidden = false;
        requestAnimationFrame(() => { mobileToast.dataset.visible = "true"; });
        setTimeout(() => {
          mobileToast.dataset.visible = "false";
          setTimeout(() => { mobileToast.hidden = true; }, 250);
        }, 2500);
        try { sessionStorage.setItem(HINT_KEY, "1"); } catch (e) {}
      }

      // ─── Info popover for shortened subtitle (MOB-9) ────────────
      document.addEventListener("click", (e) => {
        if (e.target.matches("[data-info-toggle]")) {
          e.stopPropagation();
          mobileToast.textContent = "각 일정은 해당 날짜에 마감되는 공지입니다 (공지 게시일 아님)";
          mobileToast.hidden = false;
          requestAnimationFrame(() => { mobileToast.dataset.visible = "true"; });
          setTimeout(() => {
            mobileToast.dataset.visible = "false";
            setTimeout(() => { mobileToast.hidden = true; }, 250);
          }, 3500);
        }
      });

      function renderDayDots() {
        const cells = document.querySelectorAll(".fc-daygrid-day");
        const events = calendar.getEvents();
        cells.forEach((cell) => {
          const dateStr = cell.getAttribute("data-date");
          if (!dateStr) return;
          // 기존 dots 제거
          const existing = cell.querySelector(".day-dots");
          if (existing) existing.remove();
          const dayEvents = events.filter((ev) => ev.startStr === dateStr);
          if (dayEvents.length === 0) return;
          const dots = document.createElement("div");
          dots.className = "day-dots";
          dayEvents.slice(0, 3).forEach((ev) => {
            const cat = ev.extendedProps.category || "일반공지";
            const meta = metaFor(cat);
            const dot = document.createElement("span");
            dot.className = "day-dot";
            dot.setAttribute("data-category", meta.key);
            dots.appendChild(dot);
          });
          if (dayEvents.length > 3) {
            const more = document.createElement("span");
            more.className = "day-dots__more";
            more.textContent = `+${dayEvents.length - 3}`;
            dots.appendChild(more);
          }
          const target = cell.querySelector(".fc-daygrid-day-events") || cell.querySelector(".fc-daygrid-day-frame");
          if (target) target.appendChild(dots);
        });
      }

      const calendarEl = document.getElementById("calendar");
      const calendar = new FullCalendar.Calendar(calendarEl, {
        locale: "ko",
        initialView: preferredInitialView(),
        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,listMonth",
        },
        buttonText: {
          today: "오늘",
          month: "월",
          list: "목록",
        },
        // Variable-height rows: empty weeks collapse, busy weeks grow
        // tall enough to show every event with its full title.
        height: "auto",
        expandRows: false,
        dayMaxEvents: false,
        displayEventTime: false,
        events: "./events.json",
        eventDidMount: function (info) {
          const cat = info.event.extendedProps.category || "일반공지";
          const meta = metaFor(cat);
          const important = !!info.event.extendedProps.important;
          const stripped = stripPrefix(info.event.title);

          // a11y / native tooltip fallback
          info.el.setAttribute(
            "title",
            (important ? "★ " : "") + info.event.title + ` [${cat}]`
          );
          info.el.setAttribute(
            "aria-label",
            `${meta.short} 카테고리, ${stripped}` + (important ? ", 중요 일정" : "")
          );
          info.el.setAttribute("data-category", meta.key);
          if (important) info.el.classList.add("fc-event-important");

          // Rebuild title node: inline-block chip-tag + flowing title text.
          // Putting the chip INSIDE the title (not as a flex sibling) makes
          // line-2 wrap naturally below the chip — filling the empty space
          // under the tag — and -webkit-line-clamp can still clamp at 2 lines.
          const titleTarget =
            info.el.querySelector(".fc-event-title") ||
            info.el.querySelector(".fc-list-event-title a") ||
            info.el.querySelector(".fc-list-event-title");
          if (titleTarget && !titleTarget.querySelector(".chip-tag")) {
            titleTarget.classList.add("event-chip__title");
            while (titleTarget.firstChild) {
              titleTarget.removeChild(titleTarget.firstChild);
            }
            const tag = document.createElement("span");
            tag.className = "chip-tag";
            tag.textContent = meta.short;
            titleTarget.appendChild(tag);
            titleTarget.appendChild(document.createTextNode(" "));
            titleTarget.appendChild(
              document.createTextNode((important ? "★ " : "") + stripped),
            );
          }

          const fullText = (important ? "★ " : "") + stripped + ` · [${cat}]`;
          info.el.setAttribute("aria-describedby", "event-tooltip");
          info.el.addEventListener("mouseenter", () => showTooltip(info.el, fullText));
          info.el.addEventListener("mouseleave", hideTooltip);
          info.el.addEventListener("focus", () => showTooltip(info.el, fullText));
          info.el.addEventListener("blur", hideTooltip);
        },
        dateClick: function (info) {
          if (window.innerWidth > MOBILE_MAX_PX) return;
          if (calendar.view.type !== "dayGridMonth") return;
          const dayEvents = calendar.getEvents().filter((ev) => ev.startStr === info.dateStr);
          openDaySheet(info.dateStr, dayEvents);
        },
        eventClick: function (info) {
          info.jsEvent.preventDefault();
          showModal(info.event);
        },
        dayCellDidMount: function (info) {
          if (window.innerWidth > MOBILE_MAX_PX) return;
          if (calendar.view.type !== "dayGridMonth") return;
          const iso = info.date.toISOString().slice(0, 10);
          // 첫 paint 시 events가 비어 있을 수 있어 datesSet에서도 재호출
        },
        datesSet: function (info) {
          rememberView(info.view.type);
          document.body.dataset.view = info.view.type;
          // 모바일 + 월뷰일 때 dot 마커 렌더
          if (window.innerWidth <= MOBILE_MAX_PX && info.view.type === "dayGridMonth") {
            requestAnimationFrame(renderDayDots);
          }
        },
        loading: function (isLoading) {
          if (!isLoading) {
            const evs = calendar.getEvents();
            document.getElementById("event-count").textContent =
              `${evs.length}건 마감 예정`;
            if (window.innerWidth <= MOBILE_MAX_PX && calendar.view.type === "dayGridMonth") {
              requestAnimationFrame(renderDayDots);
            }
          }
        },
      });
      calendar.render();
      document.body.dataset.view = calendar.view.type;
      maybeShowMobileHint();
    })();
  </script>
</body>
</html>
